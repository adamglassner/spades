# Builds Spades: A Brooklyn Rooftop Card Game for Windows and publishes it as a GitHub Release.
# Ironite Launcher installs and updates the game from the latest release, so
# every release must include Spades-<version>-windows.zip.
#
# To release: bump the version and add a new section to CHANGELOG.md, then push to
# main. If that version has no release yet, this builds it and publishes
# v<version> (creating the tag). Pushes that don't change the version do nothing.
# "Run workflow" on the Actions tab does the same check by hand.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      setup: ${{ steps.check.outputs.setup }}
    steps:
      - uses: actions/checkout@v4

      - name: Is this version already released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 -oE '^## \[[0-9][0-9.]*' "CHANGELOG.md" | tr -d '#[ ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -q -- '-Setup-'; then
            echo "setup=false" >> "$GITHUB_OUTPUT"
          else
            echo "setup=true" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released - nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$VERSION"; echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.check.outputs.skip != 'true'
        with:
          go-version: "1.24"

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: bash build.sh

      - name: Package
        if: steps.check.outputs.skip != 'true'
        id: pkg
        run: |
          set -euo pipefail
          VERSION=$(tr -d ' \r\n' < "dist/Spades/VERSION" 2>/dev/null || true)
          [ -n "$VERSION" ] || VERSION=$(grep -m1 -oE '^## \[[0-9][0-9.]*' "CHANGELOG.md" | tr -d '#[ ')
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match the game version $VERSION"; exit 1
          fi
          ZIP="Spades-$VERSION-windows.zip"
          (cd "$(dirname "dist/Spades")" && zip -qr "$GITHUB_WORKSPACE/$ZIP" "$(basename "dist/Spades")")
          # Release notes: the newest section of the changelog
          awk 'BEGIN{n=0} /^## /{n++; if(n==2) exit} n==1 && !/^## /' "CHANGELOG.md" > notes.md
          printf '\n---\nInstall and update this game with **Ironite Launcher** (https://github.com/adamglassner/launcher), or download the zip, unzip it and run Spades.exe.\n' >> notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.skip != 'true'
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Spades: A Brooklyn Rooftop Card Game ${{ steps.pkg.outputs.version }}"
          body_path: notes.md
          files: ${{ steps.pkg.outputs.zip }}
          make_latest: true

  # The standalone installer, built with Inno Setup (preinstalled on Windows runners)
  # and added to the same release.
  setup:
    needs: release
    if: needs.release.outputs.setup == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        shell: bash
        run: bash build.sh
      - name: Installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DGameVersion=${{ needs.release.outputs.version }}" installer\SpadesSetup.iss
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.release.outputs.version }}" "Output/Spades-Setup-v${{ needs.release.outputs.version }}.exe" --clobber --repo "$GITHUB_REPOSITORY"
